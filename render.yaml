services:
  - type: web
    name: nex2i-mvp-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build --workspace @nex2i/api
    startCommand: npm run start --workspace @nex2i/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: nex2i-mvp-db
          property: connectionString
databases:
  - name: nex2i-mvp-db
    plan: free
